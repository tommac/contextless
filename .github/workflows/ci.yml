name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (scripted providers, no model calls)
        run: go test ./... -count=1
      - name: Demo
        run: make demo
      - name: Replay the published creativity experiment (no model calls)
        run: |
          python3 -m unittest discover -s examples/obsidian/studytool
          python3 -m unittest discover -s examples/obsidian/creativity-study5
          bin/cx demo creativity
          python3 examples/obsidian/creativity-study5/replay.py --cx ./bin/cx
